server:
  port: 8080

spring:
  application:
    name: resource-server
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: validate
  datasource:
    password: ${DB_PASSWORD}
    username: ${DB_USERNAME}
    url: jdbc:postgresql://localhost:5432/keycloak-exploring-db
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_BFF_CLIENT_ID}
            client-secret: ${KEYCLOAK_BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
  docker:
    compose:
      start:
        command: up
      stop:
        command: down
      enabled: false
  data:
    redis:
      port: ${REDIS_PORT}
      host: ${REDIS_HOST}

cors:
  urls: ${CORS_URLS}
csrf:
  domain: ${CSRF_DOMAIN}
auth:
  post-redir-url: ${POST_AUTH_REDIRECT_URL}
app:
  audience: ${APP_AUDIENCE}
keycloak:
  server-ulr: ${KEYCLOAK_SERVER_URL}
  realm: ${KEYCLOAK_REALM_NAME}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

logging:
  level:
    org.springframework.security: trace
